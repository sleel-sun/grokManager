[project]
name = "grok2api"
version = "2.0.4.rc3"
description = "grokManager is an integrated FastAPI Grok gateway, WebUI, account-pool manager, and browser maintainer with OpenAI/Anthropic-compatible APIs, media generation, proxy runtime, and bulk account operations."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.0",
    "aiohttp-socks>=0.11.0",
    "aiomysql>=0.2.0",
    "asyncpg>=0.31.0",
    "certifi>=2025.10.5",
    "cryptography>=48.0.1",
    "curl-cffi>=0.15.0",
    "fastapi>=0.119.0",
    "granian>=2.7.4",
    "greenlet>=3.3.1",
    "loguru>=0.7.3",
    "orjson>=3.11.4",
    "pillow>=11.0.0",
    "pydantic>=2.12.3",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.31",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.46",
    "starlette>=1.1.0",
    "tiktoken>=0.8.0",
    "tomli-w>=1.2.0",
]

[project.optional-dependencies]
maintainer = [
    "DrissionPage==4.1.0.9",
    "PyVirtualDisplay>=3.0",
    "requests>=2.32.3",
]

[project.scripts]
grokmanager-maintainer = "app.maintainer.runner:main"
grok2api-maintainer = "app.maintainer.runner:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.0",
]
