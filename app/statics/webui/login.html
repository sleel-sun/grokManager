<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="login.webuiPageTitle">grokManager - WebUI</title>
  <link rel="icon" href="/favicon.ico?v={{APP_VERSION}}">
  <link href="https://cdn.jsdelivr.net/npm/geist@1.0.0/dist/fonts/geist-sans/style.css" rel="stylesheet">
  <link href="/static/css/app.css?v={{APP_VERSION}}" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-bg"></div>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <span class="flex items-center gap-2" style="color:inherit">
          <span>grokManager</span>
        </span>
      </div>
      <div class="login-title" data-i18n="login.webuiTitle">WebUI</div>
      <div class="login-subtitle" data-i18n="login.webuiSubtitle">请输入用户名和访问密码</div>
      <div class="login-form">
        <input type="text" id="username" placeholder="用户名（单密码模式可留空）" data-i18n-placeholder="login.webuiUsernamePlaceholder" class="input" style="height:32px;font-size:12px" autocomplete="username">
        <input type="password" id="key" placeholder="访问密码" data-i18n-placeholder="login.webuiPlaceholder" class="input" style="height:32px;font-size:12px" autocomplete="current-password">
        <button onclick="login()" class="btn btn-primary w-full" style="font-size:12px" data-i18n="login.enter">进入</button>
      </div>
    </div>
  </div>
  <script src="/static/js/i18n.js?v={{APP_VERSION}}"></script>
  <script src="/static/js/auth.js?v={{APP_VERSION}}-logoutfix5"></script>
  <script src="/static/js/toast.js?v={{APP_VERSION}}"></script>
  <script src="/static/js/footer.js?v={{APP_VERSION}}"></script>
  <script>
    const usernameInput = document.getElementById('username');
    const el = document.getElementById('key');
    [usernameInput, el].forEach(input => input.addEventListener('keypress', e => { if (e.key === 'Enter') login(); }));
    const VERIFY = WEBUI_API+'/verify';

    async function login() {
      const username = usernameInput.value.trim();
      const password = el.value;
      try {
        const user = await verifyWebuiAccess(VERIFY, username, password, { authOnly: true, loginIntent: true });
        if (user) {
          try {
            await webuiAuth.set(username, password, user);
            webuiClearLoggedOut();
          } catch (e) {
            console.warn('webui credential storage failed', e);
            showToast(t('common.authStorageFailed'), 'error');
          }
          location.href='/webui/chat';
        } else {
          showToast(t('common.invalidKey'), 'error');
        }
      } catch { showToast(t('common.connectionFailed'), 'error'); }
    }

    (async () => {
      let skipAutoLogin = false;
      try {
        const params = new URLSearchParams(location.search);
        if (params.get('logout') === '1') webuiMarkLoggedOut();
        skipAutoLogin = webuiWasLoggedOut();
        if (!skipAutoLogin && await verifyStoredWebuiAccess(VERIFY, { authOnly: true })) { location.href='/webui/chat'; return; }
      } catch {}
      if (typeof renderSiteFooter === 'function') await renderSiteFooter();
    })();
  </script>
</body>
</html>
