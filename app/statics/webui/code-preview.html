<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Preview</title>
  <link rel="icon" href="/favicon.ico?v={{APP_VERSION}}">
  <style>
    :root{color-scheme:light;--bg:#f7f5ef;--panel:#fff;--fg:#171717;--muted:#6f6a61;--line:#ded7cc;--dark:#201f1d}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .preview-top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line);background:rgba(247,245,239,.92);backdrop-filter:blur(10px)}
    .preview-title{display:grid;gap:2px;min-width:0}
    .preview-title strong{font-size:13px}
    .preview-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}
    .preview-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
    .preview-btn{height:30px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--dark);font:600 12px/1 ui-sans-serif,system-ui,sans-serif;cursor:pointer}
    .preview-btn:hover{border-color:#c8beb0;background:#fbfaf7}
    .preview-main{min-height:0;padding:14px}
    .preview-frame{display:block;width:100%;height:100%;min-height:280px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 18px 46px rgba(22,20,16,.12)}
    .preview-empty{height:100%;min-height:280px;display:grid;place-items:center;text-align:center;padding:24px;border:1px dashed #cfc6b8;border-radius:16px;background:rgba(255,255,255,.62);color:var(--muted)}
    .preview-empty strong{display:block;margin-bottom:6px;color:var(--fg);font-size:16px}
    [hidden]{display:none !important}
    @media (max-width:640px){.preview-top{align-items:flex-start;flex-direction:column}.preview-actions{width:100%;overflow-x:auto}.preview-main{padding:10px}.preview-frame{border-radius:12px}}
  </style>
</head>
<body>
  <header class="preview-top">
    <div class="preview-title">
      <strong>Code Preview</strong>
      <span id="previewUrl"></span>
    </div>
    <div class="preview-actions">
      <button id="copyUrlBtn" class="preview-btn" type="button">Copy URL</button>
      <button id="reloadBtn" class="preview-btn" type="button">Reload</button>
    </div>
  </header>
  <main class="preview-main">
    <iframe id="previewFrame" class="preview-frame" sandbox="allow-scripts allow-forms allow-modals allow-popups" referrerpolicy="no-referrer" title="Code preview"></iframe>
    <section id="previewEmpty" class="preview-empty" hidden>
      <div>
        <strong>Preview content is not available.</strong>
        <p>Open this URL in the same browser that generated it, or regenerate the preview from WebUI chat.</p>
      </div>
    </section>
  </main>
  <script>
    (function () {
      var STORE_PREFIX = 'grok2api_webui_code_preview_';
      var params = new URLSearchParams(window.location.search);
      var id = String(params.get('id') || '').replace(/[^a-zA-Z0-9_-]/g, '');
      var frame = document.getElementById('previewFrame');
      var empty = document.getElementById('previewEmpty');
      var previewUrl = document.getElementById('previewUrl');
      var copyUrlBtn = document.getElementById('copyUrlBtn');
      var reloadBtn = document.getElementById('reloadBtn');

      function showEmpty() {
        frame.hidden = true;
        empty.hidden = false;
      }

      function readPreview() {
        if (!id) return null;
        try {
          var raw = window.localStorage.getItem(STORE_PREFIX + id);
          return raw ? JSON.parse(raw) : null;
        } catch (_e) {
          return null;
        }
      }

      function loadPreview() {
        var doc = readPreview();
        if (!doc || typeof doc.srcdoc !== 'string' || !doc.srcdoc.trim()) {
          showEmpty();
          return;
        }
        frame.hidden = false;
        empty.hidden = true;
        frame.srcdoc = doc.srcdoc;
        if (doc.title) document.title = String(doc.title);
      }

      function copyUrl() {
        var value = window.location.href;
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          navigator.clipboard.writeText(value).then(function () {
            copyUrlBtn.textContent = 'Copied';
            setTimeout(function () { copyUrlBtn.textContent = 'Copy URL'; }, 1200);
          }).catch(function () {});
        }
      }

      previewUrl.textContent = window.location.href;
      copyUrlBtn.addEventListener('click', copyUrl);
      reloadBtn.addEventListener('click', loadPreview);
      loadPreview();
    })();
  </script>
</body>
</html>
